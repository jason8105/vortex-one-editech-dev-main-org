name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Added 'clean' to clear out old corrupted Gradle caches before building
      - name: Build APK
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Locate and Stage Compiled APK
        id: find_apk
        run: |
          echo "Staging the freshly compiled APK..."
          mkdir -p staging_apks
          
          # Only copy the compiled APK from the build output directory
          # This explicitly ignores the microg.apk and vending.apk in your assets folder
          cp app/build/outputs/apk/debug/*.apk staging_apks/
          
          # Verify the file was copied successfully
          if [ -z "$(ls -A staging_apks/*.apk 2>/dev/null)" ]; then
            echo "::error::No compiled APK found in build outputs."
            exit 1
          fi
          
          echo "Successfully staged compiled APK."

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apks
          path: staging_apks/*.apk
          retention-days: 14
          if-no-files-found: error
